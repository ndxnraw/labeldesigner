name: Publish ND LabelDesigner 2.7.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-2.7.1.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged files
        working-directory: Releases/v2.7.1
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.7.1 >/dev/null 2>&1; then
            echo "Release v2.7.1 already exists. No existing assets changed."
            exit 0
          fi
          gh release create v2.7.1 \
            --target "$GITHUB_SHA" --title "ND LabelDesigner 2.7.1" --latest \
            --notes-file Releases/v2.7.1/Release-notes.md \
            Releases/v2.7.1/ND-LabelDesigner-2.7.1-Windows.zip \
            Releases/v2.7.1/ND-LabelDesigner-2.7.1.exe \
            Releases/v2.7.1/Navod-2.7.1.txt \
            Releases/v2.7.1/SHA256SUMS.txt
