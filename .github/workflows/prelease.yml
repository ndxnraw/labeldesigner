name: Prelease validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: scripts\test.cmd
      - name: Build and validate package
        shell: cmd
        run: scripts\package.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: ND-LabelDesigner-prelease-Windows
          path: build/packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: ignore
