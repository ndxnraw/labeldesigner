name: Publish ND LabelDesigner 3.0.8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-3.0.8.yml']
permissions:
  contents: write
concurrency:
  group: publish-labeldesigner-308
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release package and source files
        run: |
          (cd Releases/v3.0.8 && sha256sum --check SHA256SUMS.txt)
          sha256sum --check SHA256SUMS.txt
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v3.0.8 >/dev/null 2>&1; then
            echo "Release v3.0.8 already exists; preserved without changes."
          else
            gh release create v3.0.8 --draft --target "$GITHUB_SHA" --title "ND LabelDesigner 3.0.8" --notes-file Releases/v3.0.8/Release-notes.md Releases/v3.0.8/ND-LabelDesigner-3.0.8-Windows.zip Releases/v3.0.8/SHA256SUMS.txt
            gh release edit v3.0.8 --draft=false --latest
          fi
