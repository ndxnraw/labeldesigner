name: Publish ND LabelDesigner 3.0.5 and original 1.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-3.0.5.yml']
permissions:
  contents: write
concurrency:
  group: publish-labeldesigner-305
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original and current release packages
        run: |
          (cd Releases/v1.0 && sha256sum --check SHA256SUMS.txt)
          (cd Releases/v3.0.5 && sha256sum --check SHA256SUMS.txt)
          sha256sum --check SHA256SUMS.txt
      - name: Publish first version as an archival release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            echo "Release v1.0 already exists; preserved without changes."
          else
            gh release create v1.0 --draft --target "9cf977b3fa5a5e377ebaaffefb106d37dce85c6c" --title "EAN Etikety 1.0 — prvá verzia" --notes-file Releases/v1.0/Release-notes.md Releases/v1.0/EAN-Etikety-Windows.zip Releases/v1.0/SHA256SUMS.txt
            gh release edit v1.0 --draft=false --latest=false
          fi
      - name: Publish current Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v3.0.5 >/dev/null 2>&1; then
            echo "Release v3.0.5 already exists; preserved without changes."
          else
            gh release create v3.0.5 --draft --target "$GITHUB_SHA" --title "ND LabelDesigner 3.0.5" --notes-file Releases/v3.0.5/Release-notes.md Releases/v3.0.5/ND-LabelDesigner-3.0.5-Windows.zip Releases/v3.0.5/SHA256SUMS.txt
            gh release edit v3.0.5 --draft=false --latest
          fi
