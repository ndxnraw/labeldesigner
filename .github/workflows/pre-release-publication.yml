name: Pre-release publication check
on:
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.tag_name == 'Pre-release' && !github.event.release.draft)
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the public update identity
        shell: pwsh
        env:
          PUBLISHED_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            ./scripts/test-published-update.ps1 -PublishedTarget $env:PUBLISHED_TARGET
          } else {
            ./scripts/test-published-update.ps1
          }
