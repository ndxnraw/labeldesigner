name: Pre-release validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test publication identity checks
        shell: pwsh
        run: ./tests/tools/TestPublishedUpdate.ps1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build .NET 10
        shell: powershell
        run: .\scripts\build-sdk.ps1
      - name: Test modern Windows runtime
        shell: powershell
        run: .\scripts\test-sdk.ps1
      - name: Publish and validate self-contained modern package
        shell: powershell
        run: .\scripts\publish-modern.ps1
      - name: Verify the managed update package and extracted application
        shell: powershell
        run: .\scripts\test-update-packages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ND-LabelDesigner-Pre-release-Windows-NET10-x64
          path: |
            build/packages/ND-LabelDesigner-Pre-release-Windows-NET10-x64.zip
            build/packages/SHA256SUMS-NET10.txt
            build/packages/UPDATE-INDEX.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/sdk-test-results/
            build/update-package-results/
          if-no-files-found: ignore
